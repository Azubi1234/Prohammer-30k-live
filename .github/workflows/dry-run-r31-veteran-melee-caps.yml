name: Dry-run R31 Veteran Melee Caps
on:
  push:
    paths:
      - '.github/workflows/dry-run-r31-veteran-melee-caps.yml'
permissions: {contents: write}
jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Dry run R31
        run: python .github/build/live_r31_veteran_melee_caps.py
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-live-r31-veteran-melee-caps.txt
          git diff --cached --quiet || git commit -m "Dry-run R31: Veteran melee caps"
          git push
