name: Apply Live R20 Iron Hands Mobile Bionics
on:
  push:
    paths:
      - '.github/workflows/apply-live-r20-iron-hands-mobile-bionics.yml'
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R20
        env: {R20_APPLY: '1'}
        run: python .github/build/live_r20_iron_hands_mobile_bionics.py
      - name: Verify revisions
        run: |
          python - <<'PY'
          import re, xml.etree.ElementTree as ET
          cat=ET.parse('Legiones Astartes.cat').getroot()
          idx=open('index.xml',encoding='utf-8').read()
          assert cat.get('revision')=='20', cat.get('revision')
          m=re.search(r'filePath="Legiones Astartes\.cat"[^>]*dataRevision="(\d+)"',idx)
          assert m and m.group(1)=='20', m.group(1) if m else None
          print('Verified CAT=20 index=20')
          PY
      - name: Commit Live R20
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r20-iron-hands-mobile-bionics.txt
          git diff --cached --quiet || git commit -m "Live R20: Iron Hands mobile Bionics and forced publish"
          git push
