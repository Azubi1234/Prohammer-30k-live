name: Apply Live R46 Alpha Rewards
on:
  push:
    paths: ['.github/workflows/apply-live-r46-alpha-rewards.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/live_r46_alpha_rewards.py
      - run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot();g=ET.parse('Prohammer 30k.gst').getroot();i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='46' and c.get('gameSystemRevision')=='11'
          assert g.get('revision')=='11'
          assert 'dataRevision="46"' in i and 'dataRevision="11"' in i
          print('Verified R46')
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-live-r46-alpha-rewards.txt
          git diff --cached --quiet || git commit -m "Live R46: rebuild Alpha Legion Rewards of Treachery"
          git push

