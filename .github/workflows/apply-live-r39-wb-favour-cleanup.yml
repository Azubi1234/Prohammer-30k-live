name: Apply Live R39 Word Bearers Favour Cleanup
on:
  push:
    paths:
      - '.github/workflows/apply-live-r39-wb-favour-cleanup.yml'
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R39
        run: python .github/build/live_r39_wb_favour_cleanup.py
      - name: Verify XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='39'
          assert c.get('gameSystemRevision')=='4'
          assert 'dataRevision="39"' in i
          print('Verified R39')
          PY
      - name: Commit Live R39
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r39-wb-favour-cleanup.txt
          git diff --cached --quiet || git commit -m "Live R39: clean Word Bearers Favour display"
          git push
