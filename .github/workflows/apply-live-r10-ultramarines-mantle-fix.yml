name: Apply Live R10 Ultramarines Mantle fix
on:
  push:
    paths:
      - '.github/build/live_r10_ultramarines_mantle_fix.py'
      - '.github/workflows/apply-live-r10-ultramarines-mantle-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Mantle fix
        run: python .github/build/live_r10_ultramarines_mantle_fix.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          r=ET.parse('Legiones Astartes.cat').getroot()
          assert r.get('revision')=='10'
          idx=Path('index.xml').read_text(encoding='utf-8')
          assert 'dataRevision="10"' in idx
          t=Path('inspection-live-r10-ultramarines-mantle-fix.txt').read_text(encoding='utf-8')
          assert 'secondary Artificer Armour upgrade' in t
          print(t)
          PY
      - name: Commit Live R10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Legiones Astartes.cat' index.xml inspection-live-r10-ultramarines-mantle-fix.txt
          git diff --cached --quiet || git commit -m 'Live R10: make Mantle of Ultramar an Artificer upgrade'
          git pull --rebase origin main
          git push
