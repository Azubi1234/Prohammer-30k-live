name: Diagnose R62 Fixed Legion Roots
on:
  push:
    paths: ['.github/workflows/diag-r62-fixed-legion-roots.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r62_fixed_legion_roots.py
