name: Dry-run R28 TS Restrictions Veterans
on:
  push:
    paths:
      - '.github/workflows/dry-run-r28-ts-restrictions-veterans.yml'
permissions: {contents: write}
jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Dry run R28
        run: python .github/build/live_r28_ts_restrictions_veterans.py
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-live-r28-ts-restrictions-veterans.txt
          git diff --cached --quiet || git commit -m "Dry-run R28: TS restrictions and Veteran scaling"
          git push
