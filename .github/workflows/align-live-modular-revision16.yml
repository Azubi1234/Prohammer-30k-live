name: Align live modular revision 16
on:
  push:
    branches: [main]
    paths: ['.github/build/align_modular_revision16.py','.github/workflows/align-live-modular-revision16.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/build/align_modular_revision16.py
      - run: python .github/build/validate_modular_family.py
      - run: python .github/build/validate_modular_loadability.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modular-catalogues-generated
          git diff --cached --quiet || git commit -m 'Align live modular catalogues to game system revision 16'
          git pull --rebase origin main
          git push origin HEAD:main
