name: Generate modular Legion catalogues

on:
  push:
    branches: [modular-catalogues]
    paths:
      - '.github/build/generate_modular_legions.py'
      - '.github/workflows/generate-modular-legions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate 18 staging catalogues
        run: python .github/build/generate_modular_legions.py
      - name: Validate generated XML
        run: |
          python - <<'PY'
          import glob,xml.etree.ElementTree as ET
          fs=glob.glob('modular-catalogues-generated/*.cat')
          assert len(fs)==18, len(fs)
          for f in fs: ET.parse(f)
          print('Validated',len(fs),'generated Legion catalogues')
          PY
      - name: Commit generated staging catalogues
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modular-catalogues-generated
          git diff --cached --quiet || git commit -m 'Generate 18 modular Legion staging catalogues'
          git pull --rebase origin modular-catalogues
          git push origin HEAD:modular-catalogues
