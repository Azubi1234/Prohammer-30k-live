name: Apply Live R56 Thousand Sons Psychic Gates
# retry with baseline unresolved-link validation
on:
  push:
    paths: ['.github/workflows/apply-live-r56-ts-psychic-gates.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R56
        run: python .github/build/live_r56_ts_linked_psychic_gates.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          g=ET.parse('Prohammer 30k.gst').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='56' and c.get('gameSystemRevision')=='14'
          assert g.get('revision')=='14'
          assert 'dataRevision="56"' in i and 'dataRevision="14"' in i
          assert 'ns0:' not in open('Legiones Astartes.cat',encoding='utf-8').read()
          print('Verified R56')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-live-r56-ts-linked-psychic-gates.txt
          git diff --cached --quiet || git commit -m "Live R56: fix Thousand Sons psychic visibility"
          git push
