name: Diagnose R34 Reference Rules and Sons of Horus
on:
  push:
    paths:
      - '.github/workflows/diag-r34-reference-rules-soh.yml'
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Diagnose
        run: python .github/build/diag_r34_reference_rules_soh.py
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r34-reference-rules-soh-names.txt
          git diff --cached --quiet || git commit -m "Diagnostic R34: reference rules and Sons of Horus"
          git push
