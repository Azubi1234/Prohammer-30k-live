name: Apply Live R54 Hard Cache Bust
on:
  push:
    paths: ['.github/workflows/apply-live-r54-cache-bust.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply metadata-only R54 cache bust
        run: python .github/build/live_r54_cache_bust.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          g=ET.parse('Prohammer 30k.gst').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='54'
          assert c.get('gameSystemRevision')=='12'
          assert g.get('revision')=='12'
          assert 'dataRevision="54"' in i
          assert 'dataRevision="12"' in i
          print('Verified R54 hard cache-bust')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-live-r54-cache-bust.txt
          git diff --cached --quiet || git commit -m "Live R54: hard cache-bust New Recruit"
          git push
