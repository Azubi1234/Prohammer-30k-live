name: Diagnose Live R2 World Eaters
on:
  push:
    paths:
      - '.github/build/diag_live_r2_world_eaters.py'
      - '.github/workflows/diag-live-r2-world-eaters.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Diagnose World Eaters
        run: python .github/build/diag_live_r2_world_eaters.py
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-live-r2-world-eaters.txt
          git diff --cached --quiet || git commit -m 'Diagnostic: live R2 World Eaters'
          git pull --rebase origin main
          git push
