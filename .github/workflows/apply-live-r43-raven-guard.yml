name: Apply Live R43 Raven Guard
on:
  push:
    paths: ['.github/workflows/apply-live-r43-raven-guard.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R43
        run: python .github/build/live_r43_raven_guard.py
      - name: Verify XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot();g=ET.parse('Prohammer 30k.gst').getroot();i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='43' and c.get('gameSystemRevision')=='8'
          assert g.get('revision')=='8'
          assert 'dataRevision="43"' in i and 'dataRevision="8"' in i
          assert 'ns0:' not in i
          print('Verified R43')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-live-r43-raven-guard.txt
          git diff --cached --quiet || git commit -m "Live R43: Raven Guard implementation"
          git push
