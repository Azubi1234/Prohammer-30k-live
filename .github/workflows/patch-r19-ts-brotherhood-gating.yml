name: Patch R19 TS Brotherhood gating
on:
  push:
    paths:
      - '.github/build/patch_r19_ts_brotherhood_gating.py'
      - '.github/workflows/patch-r19-ts-brotherhood-gating.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/patch_r19_ts_brotherhood_gating.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/build/live_r19_thousand_sons_cleanup.py
          git diff --cached --quiet || git commit -m "Fix R19 TS Brotherhood psychic gating"
          git push
