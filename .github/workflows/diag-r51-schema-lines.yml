name: Diagnose R51 Schema Lines
on:
  push:
    paths: ['.github/workflows/diag-r51-schema-lines.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: pip install lxml
      - run: python .github/build/diag_r51_schema_lines.py
