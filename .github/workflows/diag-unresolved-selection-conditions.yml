name: Diagnose Unresolved Selection Conditions
on:
  push:
    paths: ['.github/workflows/diag-unresolved-selection-conditions.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_unresolved_selection_conditions.py
