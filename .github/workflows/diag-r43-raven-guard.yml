name: Diagnose R43 Raven Guard Baseline
on:
  push:
    paths: ['.github/workflows/diag-r43-raven-guard.yml']
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r43_raven_guard.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r43-raven-guard-baseline.txt
          git diff --cached --quiet || git commit -m "Diagnostic R43: Raven Guard baseline"
          git push
