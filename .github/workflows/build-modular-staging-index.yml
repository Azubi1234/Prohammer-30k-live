name: Build modular staging index v2

on:
  push:
    branches: [modular-catalogues]
    paths:
      - '.github/build/build_modular_staging_index.py'
      - '.github/workflows/build-modular-staging-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/build/build_modular_staging_index.py
      - name: Commit staging index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-modular-staging.xml
          git diff --cached --quiet || git commit -m 'Build modular New Recruit staging index'
          git pull --rebase origin modular-catalogues
          git push origin HEAD:modular-catalogues
