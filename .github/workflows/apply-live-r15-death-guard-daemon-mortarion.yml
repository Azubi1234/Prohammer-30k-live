name: Apply Live R15 Death Guard Daemon Mortarion
on:
  push:
    paths:
      - '.github/build/live_r15_death_guard_daemon_mortarion.py'
      - '.github/workflows/apply-live-r15-death-guard-daemon-mortarion.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply R15 repair
        run: python .github/build/live_r15_death_guard_daemon_mortarion.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r=ET.parse('Legiones Astartes.cat').getroot()
          assert r.get('revision') == '15'
          ET.parse('index.xml')
          PY
      - name: Commit Live R15
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Legiones Astartes.cat' index.xml inspection-live-r15-death-guard-daemon-mortarion.txt
          git commit -m 'Live R15: fix Daemon Mortarion and Plague Marine upgrades' || exit 0
          git push