name: Apply Live R36 Sons of Horus Rites and Rule Dedupe
on:
  push:
    paths:
      - '.github/workflows/apply-live-r36-soh-rites-dedupe.yml'
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R36
        run: python .github/build/live_r36_soh_rites_dedupe.py
      - name: Parse and revision verification
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          g=ET.parse('Prohammer 30k.gst').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='36'
          assert c.get('gameSystemRevision')=='2'
          assert g.get('revision')=='2'
          assert 'dataRevision="36"' in i
          assert 'dataRevision="2"' in i
          assert 'ns0:' not in i
          print('Verified R36 XML and revisions')
          PY
      - name: Commit Live R36
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-live-r36-soh-rites-rule-dedupe-names.txt
          git diff --cached --quiet || git commit -m "Live R36: Sons of Horus Rites, shared rules and unit names"
          git push
