name: Apply Live R3 World Eaters repair
on:
  push:
    paths:
      - '.github/build/live_r3_world_eaters_fix.py'
      - '.github/workflows/apply-live-r3-world-eaters-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply World Eaters repair
        run: python .github/build/live_r3_world_eaters_fix.py
      - name: Verify XML and revision
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          r=ET.parse('Legiones Astartes.cat').getroot()
          assert r.get('revision')=='3'
          assert r.get('gameSystemRevision')=='1'
          idx=Path('index.xml').read_text(encoding='utf-8')
          assert 'filePath="Legiones Astartes.cat"' in idx and 'dataRevision="3"' in idx
          print(Path('inspection-live-r3-world-eaters-fix.txt').read_text(encoding='utf-8'))
          PY
      - name: Commit Live R3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Legiones Astartes.cat' index.xml inspection-live-r3-world-eaters-fix.txt
          git diff --cached --quiet || git commit -m 'Live R3: fix World Eaters retinues and Triarii options'
          git pull --rebase origin main
          git push