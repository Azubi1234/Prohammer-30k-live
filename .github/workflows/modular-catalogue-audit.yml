name: Modular catalogue migration audit v2

on:
  workflow_dispatch:
  push:
    branches: [modular-catalogues]
    paths:
      - '.github/build/modular_catalogue_audit.py'
      - '.github/workflows/modular-catalogue-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory Legion ownership and cross-links
        run: python .github/build/modular_catalogue_audit.py
      - name: Commit migration audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migration-audit
          git diff --cached --quiet || git commit -m 'Audit modular Legion catalogue ownership'
          git push
