name: Apply Live R58 Pride Veteran Sync
on:
  push:
    paths: ['.github/workflows/apply-live-r58-pride-veteran-sync.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R58
        run: python .github/build/live_r58_pride_veteran_sync.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='58'
          assert c.get('gameSystemRevision')=='14'
          assert 'dataRevision="58"' in i
          print('Verified R58')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r58-pride-veteran-sync.txt
          git diff --cached --quiet || git commit -m "Live R58: sync Pride Veteran with base unit"
          git push
