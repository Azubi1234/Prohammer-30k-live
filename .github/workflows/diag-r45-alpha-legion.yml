name: Diagnose R45 Alpha Legion Baseline
on:
  push:
    paths: ['.github/workflows/diag-r45-alpha-legion.yml']
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r45_alpha_legion.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r45-alpha-legion-baseline.txt
          git diff --cached --quiet || git commit -m "Diagnostic R45: Alpha Legion baseline"
          git push
