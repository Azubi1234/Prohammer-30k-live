name: Modular release candidate gate
on:
  push:
    branches: [modular-catalogues]
    paths: ['.github/build/validate_modular_release_candidate.py','.github/workflows/modular-release-candidate.yml','index-modular-staging.xml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/build/validate_modular_family.py
      - run: python .github/build/validate_modular_loadability.py
      - run: python .github/build/validate_modular_release_candidate.py
      - name: Commit audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modular-loadability-audit.json modular-release-candidate-audit.json || true
          git diff --cached --quiet || git commit -m 'Validate modular release candidate'
          git pull --rebase origin modular-catalogues
          git push origin HEAD:modular-catalogues
