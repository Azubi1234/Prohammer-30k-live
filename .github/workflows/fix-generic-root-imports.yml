name: Fix Generic Astartes imports
on:
  push:
    branches: [main]
    paths:
      - '.github/build/wire_modular_astartes.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Generic library with root imports
        run: python .github/build/wire_modular_astartes.py
      - name: Verify all Legion links import root entries
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns={'c':'http://www.battlescribe.net/schema/catalogueSchema'}
          fs=[f for f in glob.glob('modular-catalogues-generated/*.cat') if not f.endswith('Legiones-Astartes-Generic.cat')]
          assert len(fs)==18, len(fs)
          for f in fs:
              r=ET.parse(f).getroot()
              links=[x for x in r.findall('./c:catalogueLinks/c:catalogueLink',ns) if x.get('targetId')=='cat-7b24-e6f1-83a9-4c50']
              assert len(links)==1,(f,len(links))
              assert links[0].get('importRootEntries')=='true',(f,links[0].attrib)
          print('Verified root imports for',len(fs),'Legions')
          PY
      - name: Commit fixed catalogues
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modular-catalogues-generated
          git diff --cached --quiet || git commit -m 'Expose Generic Astartes units in all Legion catalogues'
          git pull --rebase origin main
          git push origin HEAD:main
