name: Diagnose scalable squad upgrade pattern
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-scaling-upgrade-pattern.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract scalable upgrades
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          NS='http://www.battlescribe.net/schema/catalogueSchema'; C=lambda t:f'{{{NS}}}{t}'
          root=ET.parse('Legiones Astartes.cat').getroot(); out=[]
          for uid in ('r41-unit-xii-2-red-hand-destroyer-mortalis-squad','r41-unit-xii-0-rampager-squad','tactical-unit','assault-unit'):
            u=next((x for x in root.iter(C('selectionEntry')) if x.get('id')==uid),None)
            if u is None: continue
            out.append('=== '+uid+' '+u.get('name','')+' ===')
            for e in u.iter(C('selectionEntry')):
              nm=(e.get('name') or '').lower()
              if any(k in nm for k in ('krak','melta bombs','jump pack')) and e is not u:
                out.append(ET.tostring(e,encoding='unicode'))
          Path('inspection-scaling-upgrade-pattern.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-scaling-upgrade-pattern.txt
          git diff --cached --quiet || git commit -m 'Diagnostic: scalable squad upgrade pattern'
          git pull --rebase origin main
          git push
