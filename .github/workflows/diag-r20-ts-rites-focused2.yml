name: Diagnose R20 TS Rites Focused 2
on:
  push:
    paths: ['.github/build/diag_r20_ts_rites_focused2.py','.github/workflows/diag-r20-ts-rites-focused2.yml']
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r20_ts_rites_focused2.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r20-ts-rites-focused2.txt
          git diff --cached --quiet || git commit -m "Inspect focused Thousand Sons rite structures"
          git push
