name: Diagnose R32 Sons of Horus Core Focused
on:
  push:
    paths:
      - '.github/workflows/diag-r32-soh-core-focused.yml'
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r32_soh_core_focused.py
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r32-soh-core-focused.txt
          git diff --cached --quiet || git commit -m "Diag R32: Sons of Horus core focused"
          git push
