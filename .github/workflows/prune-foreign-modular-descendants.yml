name: Prune foreign modular descendants

on:
  push:
    branches: [modular-catalogues]
    paths:
      - '.github/build/prune_foreign_modular_descendants.py'
      - '.github/workflows/prune-foreign-modular-descendants.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/build/prune_foreign_modular_descendants.py
      - run: python .github/build/validate_modular_family.py
      - run: python .github/build/validate_modular_loadability.py
      - name: Commit pruned staging catalogues
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modular-catalogues-generated modular-loadability-audit.json
          git diff --cached --quiet || git commit -m 'Prune foreign Legion dependencies from modular catalogues'
          git pull --rebase origin modular-catalogues
          git push origin HEAD:modular-catalogues
