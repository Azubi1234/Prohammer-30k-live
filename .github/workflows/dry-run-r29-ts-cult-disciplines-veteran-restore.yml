name: Dry-run R29 TS Cult Disciplines Veteran Restore
on:
  push:
    paths:
      - '.github/workflows/dry-run-r29-ts-cult-disciplines-veteran-restore.yml'
permissions: {contents: write}
jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Dry run R29
        run: python .github/build/live_r29_ts_cult_disciplines_veteran_restore.py
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-live-r29-ts-cult-disciplines-veteran-restore.txt
          git diff --cached --quiet || git commit -m "Dry-run R29: TS cult disciplines and Veteran restore"
          git push

# debug rerun
