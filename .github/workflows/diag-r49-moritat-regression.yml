name: Diagnose R49 Moritat Regression
on:
  push:
    paths: ['.github/workflows/diag-r49-moritat-regression.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r49_moritat_regression.py
