name: One-shot Primarch Chosen Troops Fix
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-primarch-chosen-troops.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch catalogue
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("Legiones Astartes.cat")
          s = p.read_text(encoding="utf-8")
          if 'revision="68"' not in s:
              raise SystemExit("Expected catalogue revision 68")

          # Generic Veteran and Terminator hidden Troops copies: Pride OR Primarch's Chosen.
          rx = re.compile(r'<conditions>\s*<condition\b(?=[^>]*childId="rite-pride")[^>]*/>\s*</conditions>')
          repl = '<conditionGroups><conditionGroup type="or"><conditions><condition type="atLeast" value="1" field="selections" scope="force" childId="rite-pride" shared="true" includeChildSelections="true" /><condition type="atLeast" value="1" field="selections" scope="force" childId="da22-rite-primarchs-chosen" shared="true" includeChildSelections="true" includeChildForces="false" /></conditions></conditionGroup></conditionGroups>'
          s, n = rx.subn(repl, s)
          assert n == 2, f"Expected 2 generic Pride visibility conditions, got {n}"

          old = "Effects: the Primarch fulfils the compulsory HQ requirement and may be fielded from 1,500 points; Legion Veteran and Terminator Squads may be Troops and must provide the two compulsory Troops; the Primarch may take an Honour Guard or appropriate Legion bodyguard as a slotless retinue."
          new = "Effects: the Primarch fulfils the compulsory HQ requirement and may be fielded from 1,500 points; Legion Veteran Squads, Legion Terminator Squads, and Legion-specific Terminator units which normally occupy an Elites choice may be selected as Troops and must provide the two compulsory Troops; the Primarch may take an Honour Guard or appropriate Legion bodyguard as a slotless retinue."
          assert old in s
          s = s.replace(old, new)

          ids = [
            "r41-unit-iii-1-phoenix-terminator-squad",
            "r41-unit-vi-5-varagyr-wolf-guard-terminators",
            "r41-unit-viii-2-contekar-terminator-elite",
            "r41-unit-x-1-gorgon-terminator-squad",
            "r41-unit-x-2-morlock-terminator-squad",
            "r41-unit-xii-4-devourer-terminator-squad",
            "r41-unit-xiii-1-fulmentarus-terminator-squad",
            "r41-unit-xiv-0-deathshroud-terminators",
            "r41-unit-xv-0-sekhmet-terminator-cabal",
            "r41-unit-xvi-0-justaerin-terminator-squad",
            "r41-unit-xviii-0-firedrake-terminator-squad",
            "r41-unit-xix-2-deliverer-terminator-squad",
            "r41-unit-xx-2-lernaean-terminator-squad",
          ]

          def entry_bounds(text, unit_id):
              ip = text.index(f'id="{unit_id}"')
              start = text.rfind("<selectionEntry", 0, ip)
              tag = re.compile(r'</?selectionEntry\b[^>]*>')
              depth = 0
              for m in tag.finditer(text, start):
                  depth += -1 if m.group().startswith("</") else 1
                  if depth == 0:
                      return start, m.end()
              raise RuntimeError(unit_id)

          def elite_cat_bounds(block):
              tag = re.compile(r'</?categoryLink\b[^>]*>')
              it = tag.finditer(block)
              for m in it:
                  op = m.group()
                  if op.startswith("</") or 'targetId="cat-elites"' not in op or 'primary="true"' not in op:
                      continue
                  if op.endswith("/>"):
                      return m.start(), m.end(), True
                  depth = 1
                  for q in it:
                      qt = q.group()
                      if qt.startswith("</"):
                          depth -= 1
                      elif not qt.endswith("/>"):
                          depth += 1
                      if depth == 0:
                          return m.start(), q.end(), False
              raise RuntimeError("Primary Elites category not found")

          for unit_id in ids:
              a, b = entry_bounds(s, unit_id)
              block = s[a:b]
              x, y, selfclose = elite_cat_bounds(block)
              cat = block[x:y]
              hide = f'<modifier id="{unit_id}-pc-hide-elites" type="set" field="hidden" value="true"><conditionGroups><conditionGroup type="or"><conditions><condition type="atLeast" value="1" field="selections" scope="force" childId="rite-pride" shared="true" includeChildSelections="true" includeChildForces="false" /><condition type="atLeast" value="1" field="selections" scope="force" childId="da22-rite-primarchs-chosen" shared="true" includeChildSelections="true" includeChildForces="false" /></conditions></conditionGroup></conditionGroups></modifier>'
              if selfclose:
                  cat = cat[:-2] + f'><modifiers>{hide}</modifiers></categoryLink>'
              elif "<modifiers>" in cat:
                  cat = cat.replace("<modifiers>", "<modifiers>" + hide, 1)
              else:
                  cat = cat.replace("</categoryLink>", f"<modifiers>{hide}</modifiers></categoryLink>", 1)
              block = block[:x] + cat + block[y:]
              k = block.index("</categoryLinks>")
              troop = f'<categoryLink id="{unit_id}-primarchs-chosen-troops" name="Troops — Pride / Primarch&#39;s Chosen" hidden="true" targetId="cat-troops" primary="true"><modifiers><modifier id="{unit_id}-pc-show-troops" type="set" field="hidden" value="false"><conditionGroups><conditionGroup type="or"><conditions><condition type="atLeast" value="1" field="selections" scope="force" childId="rite-pride" shared="true" includeChildSelections="true" includeChildForces="false" /><condition type="atLeast" value="1" field="selections" scope="force" childId="da22-rite-primarchs-chosen" shared="true" includeChildSelections="true" includeChildForces="false" /></conditions></conditionGroup></conditionGroups></modifier></modifiers></categoryLink>'
              block = block[:k] + troop + block[k:]
              s = s[:a] + block + s[b:]

          s = s.replace('revision="68"', 'revision="69"', 1)
          s = re.sub(r'<comment>[\s\S]*?</comment>', '<comment>Revision 69: Primarch Chosen troop-role fix. Generic Legion Veteran and Terminator Troops entries now enable for Primarch Chosen as well as Pride of the Legion. Legion-specific Terminator units that normally occupy Elites dynamically move to Troops under either Rite.</comment>', s, count=1)
          p.write_text(s, encoding="utf-8")

          idx = Path("index.xml")
          x = idx.read_text(encoding="utf-8")
          old_idx = 'dataName="Legiones Astartes" dataBattleScribeVersion="2.03" dataRevision="68"'
          assert old_idx in x
          x = x.replace(old_idx, 'dataName="Legiones Astartes" dataBattleScribeVersion="2.03" dataRevision="69"', 1)
          idx.write_text(x, encoding="utf-8")
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "prohammer-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/fix-primarch-chosen-troops.yml
          git add "Legiones Astartes.cat" index.xml .github/workflows/fix-primarch-chosen-troops.yml
          git commit -m "Fix Primarch's Chosen Veteran and Terminator Troops"
          git push
