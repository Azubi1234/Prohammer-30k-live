name: Diagnose R63 TS Cult Powers
on:
  push:
    paths: ['.github/workflows/diag-r63-ts-cult-powers.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r63_ts_cult_powers.py
