name: Diagnose Alpha Reward Stale Gear
on:
  push:
    paths: ['.github/workflows/diag-alpha-reward-stale-gear.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_alpha_reward_stale_gear.py
