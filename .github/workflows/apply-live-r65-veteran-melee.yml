name: Apply Live R65 Veteran Melee Thresholds
on:
  push:
    paths: ['.github/workflows/apply-live-r65-veteran-melee.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R65
        run: python .github/build/live_r65_veteran_melee_thresholds.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='65'
          assert c.get('gameSystemRevision')=='15'
          assert 'dataRevision="65"' in i
          print('Verified R65')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r65-veteran-melee-thresholds.txt
          git diff --cached --quiet || git commit -m "Live R65: fix Veteran melee scaling"
          git push
