name: Diagnose R40 Salamanders Armoury
on:
  push:
    paths: ['.github/workflows/diag-r40-salamanders-armoury.yml']
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r40_salamanders_armoury.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r40-salamanders-armoury.txt
          git diff --cached --quiet || git commit -m "Diagnostic R40: Salamanders armoury"
          git push
