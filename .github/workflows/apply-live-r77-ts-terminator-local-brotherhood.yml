name: Apply TS Terminator local Brotherhood fix

on:
  push:
    branches: [main]
    paths:
      - '.github/build/live_r77_ts_terminator_local_brotherhood.py'
      - '.github/workflows/apply-live-r77-ts-terminator-local-brotherhood.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply canonical Terminator local-ID fix
        run: python .github/build/live_r77_ts_terminator_local_brotherhood.py
      - name: Run Terminator psychic regression test
        run: python .github/build/test_ts_terminator_psychic_rendering.py
      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("Legiones-Astartes-Generic.cat")
          ET.parse("index.xml")
          print("XML OK")
          PY
      - name: Commit live fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Legiones-Astartes-Generic.cat index.xml inspection-r77-ts-terminator-local-brotherhood.txt
          git diff --cached --quiet || git commit -m "Fix TS Terminator local Brotherhood spell visibility"
          git push
