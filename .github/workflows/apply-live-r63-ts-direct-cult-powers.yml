name: Apply Live R63 TS Direct Cult Powers
on:
  push:
    paths: ['.github/workflows/apply-live-r63-ts-direct-cult-powers.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R63
        run: python .github/build/live_r63_ts_direct_cult_powers.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot();i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='63'
          assert c.get('gameSystemRevision')=='15'
          assert 'dataRevision="63"' in i
          print('Verified R63')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r63-ts-direct-cult-powers.txt
          git diff --cached --quiet || git commit -m "Live R63: direct TS Cult power access"
          git push
