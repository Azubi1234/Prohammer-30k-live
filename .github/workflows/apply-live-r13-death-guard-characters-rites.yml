name: Apply Live R13 Death Guard characters and rites
on:
  push:
    paths:
      - '.github/build/live_r13_death_guard_characters_rites.py'
      - '.github/workflows/apply-live-r13-death-guard-characters-rites.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply R13 repair
        run: python .github/build/live_r13_death_guard_characters_rites.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          r=ET.parse('Legiones Astartes.cat').getroot(); assert r.get('revision')=='13'; assert r.get('gameSystemRevision')=='1'
          idx=Path('index.xml').read_text(); assert 'dataRevision="13"' in idx
          txt=Path('inspection-live-r13-death-guard-characters-rites.txt').read_text(); assert 'Mortarion rebuilt' in txt
          print(txt)
          PY
      - name: Commit Live R13
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Legiones Astartes.cat' index.xml inspection-live-r13-death-guard-characters-rites.txt
          git diff --cached --quiet || git commit -m 'Live R13: repair Death Guard characters and rites'
          git pull --rebase origin main
          git push
