name: Diagnose R59 TS Ancestors
on:
  push:
    paths: ['.github/workflows/diag-r59-ts-ancestors.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r59_ts_ancestors.py
