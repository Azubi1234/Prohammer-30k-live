name: Apply Live R64 TS Core Psychic Veterans
on:
  push:
    paths: ['.github/workflows/apply-live-r64-ts-core.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R64
        run: python .github/build/live_r64_ts_core.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot();i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='64'
          assert c.get('gameSystemRevision')=='15'
          assert 'dataRevision="64"' in i
          print('Verified R64')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r64-ts-core-psychic-veterans.txt
          git diff --cached --quiet || git commit -m "Live R64: repair TS psychic UI and Veteran scaling"
          git push
