name: Dry-run R30 Veteran Bolter Replacements
on:
  push:
    paths:
      - '.github/workflows/dry-run-r30-veteran-bolter-replacements.yml'
permissions: {contents: write}
jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Dry run R30
        run: python .github/build/live_r30_veteran_bolter_replacements.py
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-live-r30-veteran-bolter-replacements.txt
          git diff --cached --quiet || git commit -m "Dry-run R30: Veteran bolter replacement UI"
          git push
