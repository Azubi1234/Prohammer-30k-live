name: Wire modular Astartes catalogues

on:
  push:
    branches: [modular-catalogues]
    paths:
      - '.github/build/wire_modular_astartes.py'
      - '.github/build/validate_modular_family.py'
      - '.github/workflows/wire-modular-astartes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/build/wire_modular_astartes.py
      - run: python .github/build/validate_modular_family.py
      - name: Commit wired staging family
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modular-catalogues-generated
          git diff --cached --quiet || git commit -m 'Wire 18 Legions to Generic Astartes library'
          git pull --rebase origin modular-catalogues
          git push origin HEAD:modular-catalogues
