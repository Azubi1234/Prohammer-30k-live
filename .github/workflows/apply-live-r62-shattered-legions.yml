name: Apply Live R62 Shattered Legions
on:
  push:
    paths: ['.github/workflows/apply-live-r62-shattered-legions.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R62
        run: python .github/build/live_r62_shattered_legions.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          g=ET.parse('Prohammer 30k.gst').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='62' and c.get('gameSystemRevision')=='15'
          assert g.get('revision')=='15'
          assert 'dataRevision="62"' in i and 'dataRevision="15"' in i
          assert 'ns0:' not in i
          print('Verified R62')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-live-r62-shattered-legions.txt
          git diff --cached --quiet || git commit -m "Live R62: add Shattered Legions Theme"
          git push
