name: Diagnose R42 Salamanders Armoury Access
on:
  push:
    paths: ['.github/workflows/diag-r42-salamanders-armoury-access.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r42_salamanders_armoury_access.py
