name: Diagnose R6 Ultramarines remaining
on:
  push:
    paths:
      - '.github/build/diag_r6_ultramarines_remaining.py'
      - '.github/workflows/diag-r6-ultramarines-remaining.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r6_ultramarines_remaining.py
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-r6-ultramarines-remaining.txt
          git diff --cached --quiet || git commit -m 'Diagnostic: R6 Ultramarines remaining'
          git pull --rebase origin main
          git push
