name: Diagnose R25 TS Guard and Discipline
on:
  push:
    paths:
      - '.github/build/diag_r25_ts_guard_discipline.py'
      - '.github/workflows/diag-r25-ts-guard-discipline.yml'
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r25_ts_guard_discipline.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r25-ts-guard-discipline.txt
          git diff --cached --quiet || git commit -m "Inspect R25 TS Guard and discipline"
          git push
