name: Emergency Live R23 Rollback to R20
on:
  push:
    paths:
      - '.github/build/emergency_r23_rollback_to_r20.py'
      - '.github/workflows/emergency-live-r23-rollback.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Restore known-good R20 and publish as R23
        run: python .github/build/emergency_r23_rollback_to_r20.py
      - name: Verify restored data
        run: |
          python - <<'PY'
          import re, xml.etree.ElementTree as ET
          cat=ET.parse('Legiones Astartes.cat').getroot()
          gst=ET.parse('Prohammer 30k.gst').getroot()
          idx=open('index.xml',encoding='utf-8').read()
          assert cat.get('revision')=='23', cat.get('revision')
          assert gst.get('revision')=='1', gst.get('revision')
          m=re.search(r'filePath="Legiones Astartes\.cat"[^>]*dataRevision="(\d+)"',idx)
          assert m and m.group(1)=='23', m.group(1) if m else None
          print('Verified rollback: CAT=23 GST=1 index=23')
          PY
      - name: Commit emergency rollback
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-live-r23-emergency-rollback.txt
          git diff --cached --quiet || git commit -m "Live R23: rollback broken TS hotfix to known-good R20"
          git push
