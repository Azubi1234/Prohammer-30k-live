name: Diagnose R64 TS Minimal
on:
  push:
    paths: ['.github/workflows/diag-r64-ts-minimal.yml']
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r64_ts_minimal.py > inspection-r64-ts-minimal.txt
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r64-ts-minimal.txt
          git diff --cached --quiet || git commit -m "Diagnostic R64: TS minimal selectors"
          git push
