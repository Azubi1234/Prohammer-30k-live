name: Diagnose R7 Ultramarines deep audit
on:
  push:
    paths:
      - '.github/build/diag_r7_ultramarines_deep_audit.py'
      - '.github/workflows/diag-r7-ultramarines-deep-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r7_ultramarines_deep_audit.py
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-r7-ultramarines-deep-audit.txt
          git diff --cached --quiet || git commit -m 'Diagnostic: R7 Ultramarines deep audit'
          git pull --rebase origin main
          git push
