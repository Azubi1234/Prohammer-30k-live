name: Diagnose R17 Thousand Sons compact
on:
  push:
    paths:
      - '.github/build/diag_r17_thousand_sons_compact.py'
      - '.github/workflows/diag-r17-thousand-sons-compact.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r17_thousand_sons_compact.py
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r17-thousand-sons-compact.txt
          git diff --cached --quiet || git commit -m "Diagnose R17 Thousand Sons compact"
          git push
