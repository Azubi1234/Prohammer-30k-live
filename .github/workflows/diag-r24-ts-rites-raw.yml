name: Diagnose R24 TS Rites Raw
on:
  push:
    paths:
      - '.github/build/diag_r24_ts_rites_raw.py'
      - '.github/workflows/diag-r24-ts-rites-raw.yml'
permissions: {contents: write}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r24_ts_rites_raw.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r24-ts-rites-raw.txt
          git diff --cached --quiet || git commit -m "Inspect R24 Thousand Sons rites raw"
          git push
