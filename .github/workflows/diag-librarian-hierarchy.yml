name: Inspect librarian hierarchy
on:
  push:
    paths: ['.github/build/diag_librarian_hierarchy.py','.github/workflows/diag-librarian-hierarchy.yml']
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_librarian_hierarchy.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r18-librarian-hierarchy.txt
          git diff --cached --quiet || git commit -m "Inspect librarian psychic hierarchy"
          git push
