name: Patch and audit Primarch Chosen
on:
  push:
    branches: [modular-catalogues]
    paths: ['.github/build/patch_primarch_chosen.py','.github/workflows/patch-primarch-chosen.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/build/patch_primarch_chosen.py
      - run: python .github/build/validate_modular_family.py
      - run: python .github/build/validate_modular_loadability.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modular-catalogues-generated/Legiones-Astartes-Generic.cat primarch-chosen-terminator-audit.json modular-loadability-audit.json
          git diff --cached --quiet || git commit -m "Fix Primarch's Chosen generic Troops"
          git pull --rebase origin modular-catalogues
          git push origin HEAD:modular-catalogues
