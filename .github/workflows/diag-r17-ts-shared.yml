name: Diagnose R17 TS shared
on:
  push:
    paths:
      - '.github/build/diag_r17_ts_shared.py'
      - '.github/workflows/diag-r17-ts-shared.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r17_ts_shared.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r17-ts-shared.txt
          git diff --cached --quiet || git commit -m "Diagnose R17 TS shared upgrades"
          git push
