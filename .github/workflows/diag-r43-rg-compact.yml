name: Diagnose R43 Raven Guard Compact
on:
  push:
    paths: ['.github/workflows/diag-r43-rg-compact.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r43_rg_compact.py
