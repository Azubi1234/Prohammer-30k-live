name: Diagnose R66 TS Centurion Psychic
on:
  push:
    paths: ['.github/workflows/diag-r66-ts-centurion-psychic.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r66_ts_centurion_psychic.py
