name: Apply Live R38 Word Bearers Audit Fix
on:
  push:
    paths:
      - '.github/workflows/apply-live-r38-word-bearers-audit-fix.yml'
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/live_r38_word_bearers_audit_fix.py
      - run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot(); g=ET.parse('Prohammer 30k.gst').getroot()
          assert c.get('revision')=='38' and c.get('gameSystemRevision')=='4' and g.get('revision')=='4'
          print('Verified R38')
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-live-r38-word-bearers-audit-fix.txt
          git diff --cached --quiet || git commit -m "Live R38: Word Bearers audit fixes"
          git push
