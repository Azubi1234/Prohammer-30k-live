name: Publish structural Legion identity and TS Terminators

on:
  push:
    branches: [main]
    paths:
      - '.github/build/structural_legion_identity.py'
      - '.github/build/live_r70_ts_veteran_terminator_brotherhood.py'
      - '.github/workflows/clean-modular-legion-selectors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make Legion identity structural
        run: python .github/build/structural_legion_identity.py

      - name: Repair TS Veteran and Terminator Brotherhood wiring
        run: python .github/build/live_r70_ts_veteran_terminator_brotherhood.py

      - name: Synchronize staged Generic
        run: cp Legiones-Astartes-Generic.cat modular-catalogues-generated/Legiones-Astartes-Generic.cat

      - name: Final XML validation
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          NS="http://www.battlescribe.net/schema/catalogueSchema"; C=lambda t:f"{{{NS}}}{t}"
          legion_files=["Dark-Angels.cat","Emperor-s-Children.cat","Iron-Warriors.cat","White-Scars.cat","Space-Wolves.cat","Imperial-Fists.cat","Night-Lords.cat","Blood-Angels.cat","Iron-Hands.cat","World-Eaters.cat","Ultramarines.cat","Death-Guard.cat","Thousand-Sons.cat","Sons-of-Horus.cat","Word-Bearers.cat","Salamanders.cat","Raven-Guard.cat","Alpha-Legion.cat"]
          g=ET.parse("Legiones-Astartes-Generic.cat").getroot()
          assert not any(e.get("id")=="config-army" for e in g.findall(f"./{C('selectionEntries')}/{C('selectionEntry')}"))
          for fn in legion_files:
              r=ET.parse(fn).getroot()
              cfg=[e for e in r.findall(f"./{C('selectionEntries')}/{C('selectionEntry')}") if e.get("id")=="config-army"]
              assert len(cfg)==1,fn
              lg=next(x for x in cfg[0].iter(C("selectionEntryGroup")) if x.get("id")=="config-legion")
              assert len(lg.findall(f"./{C('selectionEntries')}/{C('selectionEntry')}"))==1,fn
          ids={x.get("id"):x for x in g.iter() if x.get("id")}
          tcg=ids["r45-cult-terminator-unit"]
          for cult in tcg.findall(f"./{C('selectionEntries')}/{C('selectionEntry')}"):
              pgs=[x for x in cult.findall(f"./{C('selectionEntryGroups')}/{C('selectionEntryGroup')}") if "Psychic Brotherhood Power" in (x.get("name") or "")]
              assert len(pgs)==1,cult.get("name")
              cs=pgs[0].findall(f"./{C('constraints')}/{C('constraint')}")
              assert any(c.get("type")=="max" and c.get("value")=="0" for c in cs),cult.get("name")
              assert pgs[0].get("hidden")!="true",cult.get("name")
              assert len(pgs[0].findall(f"./{C('entryLinks')}/{C('entryLink')}"))==7,cult.get("name")
          ET.parse("index.xml")
          print("PASS: fixed local Legion identity; Allegiance/Rites retained; TS Terminator powers structurally selectable after Brotherhood")
          PY

      - name: Commit live catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Legiones-Astartes-Generic.cat modular-catalogues-generated/Legiones-Astartes-Generic.cat *.cat index.xml inspection-ts-veteran-terminator-brotherhood.txt
          git diff --cached --quiet || git commit -m "Make Legion identity structural and fix TS Terminator powers"
          git push
