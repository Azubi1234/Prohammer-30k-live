name: Publish structural Legion identity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate canonical live files only
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          legion_files=[
            "Dark-Angels.cat","Emperor-s-Children.cat","Iron-Warriors.cat","White-Scars.cat",
            "Space-Wolves.cat","Imperial-Fists.cat","Night-Lords.cat","Blood-Angels.cat",
            "Iron-Hands.cat","World-Eaters.cat","Ultramarines.cat","Death-Guard.cat",
            "Thousand-Sons.cat","Sons-of-Horus.cat","Word-Bearers.cat","Salamanders.cat",
            "Raven-Guard.cat","Alpha-Legion.cat"
          ]

          assert not Path("modular-catalogues-generated").exists(), "staging catalogue directory must not exist on main"
          assert not Path("index-modular-staging.xml").exists(), "staging index must not exist on main"

          for fn in legion_files:
              ET.parse(fn)
          ET.parse("Legiones-Astartes-Generic.cat")
          ET.parse("index.xml")

          print("PASS: main exposes only canonical root catalogues + live index")
          PY
