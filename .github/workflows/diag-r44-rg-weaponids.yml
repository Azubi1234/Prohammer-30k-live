name: Diagnose R44 Weapon IDs
on:
  push:
    paths: ['.github/workflows/diag-r44-rg-weaponids.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r44_rg_weaponids.py
