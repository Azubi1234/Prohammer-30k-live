name: Apply Live R28 TS Restrictions Veterans
on:
  push:
    paths:
      - '.github/workflows/apply-live-r28-ts-restrictions-veterans.yml'
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R28
        env: {R28_APPLY: '1'}
        run: python .github/build/live_r28_ts_restrictions_veterans.py
      - name: Verify revisions and parse
        run: |
          python - <<'PY'
          import re, xml.etree.ElementTree as ET
          cat=ET.parse('Legiones Astartes.cat').getroot()
          idx=open('index.xml',encoding='utf-8').read()
          assert cat.get('revision')=='28', cat.get('revision')
          m=re.search(r'filePath="Legiones Astartes\.cat"[^>]*dataRevision="(\d+)"',idx)
          assert m and m.group(1)=='28', m.group(1) if m else None
          print('Verified CAT=28 index=28')
          PY
      - name: Commit Live R28
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r28-ts-restrictions-veterans.txt
          git diff --cached --quiet || git commit -m "Live R28: TS restrictions and Veteran scaling"
          git push
