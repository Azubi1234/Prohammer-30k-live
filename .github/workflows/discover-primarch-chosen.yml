name: Discover Primarch Chosen modular targets
on:
  push:
    branches: [modular-catalogues]
    paths:
      - '.github/build/discover_primarch_chosen.py'
      - '.github/workflows/discover-primarch-chosen.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/build/discover_primarch_chosen.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add primarch-chosen-discovery.json
          git diff --cached --quiet || git commit -m 'Discover Primarch Chosen modular targets'
          git pull --rebase origin modular-catalogues
          git push origin HEAD:modular-catalogues
