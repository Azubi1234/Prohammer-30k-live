name: Diagnose Shattered Primarch Leak
on:
  push:
    paths: ['.github/workflows/diag-shattered-primarch-leak.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_shattered_primarch_leak.py
