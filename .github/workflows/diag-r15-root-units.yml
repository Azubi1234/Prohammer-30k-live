name: Diagnose R15 root units
on:
  push:
    paths:
      - '.github/build/diag_r15_root_units.py'
      - '.github/workflows/diag-r15-root-units.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r15_root_units.py
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-r15-root-units.txt
          git commit -m 'Diagnostic: R15 root units' || exit 0
          git push