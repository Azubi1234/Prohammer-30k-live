name: Apply Live R19 Thousand Sons Cleanup
on:
  push:
    paths:
      - '.github/workflows/apply-live-r19-thousand-sons-cleanup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply R19 Thousand Sons cleanup
        env:
          R19_APPLY: '1'
        run: python .github/build/live_r19_thousand_sons_cleanup.py
      - name: Verify revisions
        run: |
          python - <<'PY'
          import re, xml.etree.ElementTree as ET
          cat=ET.parse('Legiones Astartes.cat').getroot()
          gst=ET.parse('Prohammer 30k.gst').getroot()
          idx=open('index.xml',encoding='utf-8').read()
          assert cat.get('revision') == '19', cat.get('revision')
          assert gst.get('revision') == '1', gst.get('revision')
          m=re.search(r'filePath="Legiones Astartes\.cat"[^>]*dataRevision="(\d+)"',idx)
          assert m and m.group(1) == '19', m.group(1) if m else None
          print('Verified CAT=19 GST=1 index=19')
          PY
      - name: Commit Live R19
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-r19-thousand-sons-cleanup.txt
          git diff --cached --quiet || git commit -m "Live R19: clean Thousand Sons psychic UI and rites"
          git push
