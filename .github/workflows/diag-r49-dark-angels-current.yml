name: Diagnose R49 Dark Angels Current
on:
  push:
    paths: ['.github/workflows/diag-r49-dark-angels-current.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r49_dark_angels_current.py
