name: Validate modular loadability

on:
  push:
    branches: [modular-catalogues]
    paths:
      - '.github/build/validate_modular_loadability.py'
      - '.github/workflows/validate-modular-loadability.yml'
      - 'modular-catalogues-generated/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/build/validate_modular_loadability.py
      - name: Commit audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modular-loadability-audit.json || true
          git diff --cached --quiet || git commit -m 'Audit modular catalogue loadability'
          git pull --rebase origin modular-catalogues
          git push origin HEAD:modular-catalogues
