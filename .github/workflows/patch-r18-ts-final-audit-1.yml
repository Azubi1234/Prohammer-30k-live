name: Patch R18 TS final audit 1
on:
  push:
    paths:
      - '.github/build/patch_r18_ts_final_audit_1.py'
      - '.github/workflows/patch-r18-ts-final-audit-1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/patch_r18_ts_final_audit_1.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/build/live_r18_thousand_sons_final_audit.py
          git diff --cached --quiet || git commit -m "Fix R18 final audit Terminator Combi source"
          git push
