name: Diagnose Legacy Donor Parsing
on:
  push:
    paths: ['.github/workflows/diag-legacy-donor-parsing.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_legacy_donor_parsing.py
