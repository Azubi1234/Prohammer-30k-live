name: Apply Live R9 Ultramarines command retinue fix
on:
  push:
    paths:
      - '.github/build/live_r9_ultramarines_command_retinue_fix.py'
      - '.github/workflows/apply-live-r9-ultramarines-command-retinue-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/live_r9_ultramarines_command_retinue_fix.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          r=ET.parse('Legiones Astartes.cat').getroot()
          assert r.get('revision')=='9'
          idx=Path('index.xml').read_text()
          assert 'dataRevision="9"' in idx
          t=Path('inspection-live-r9-ultramarines-command-retinue-fix.txt').read_text()
          assert 'Generic Praetor Terminator Command Squad now appears only' in t
          assert 'Marius Gage Terminator Command retinue text corrected' in t
          print(t)
          PY
      - name: Commit Live R9
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Legiones Astartes.cat' index.xml inspection-live-r9-ultramarines-command-retinue-fix.txt
          git diff --cached --quiet || git commit -m 'Live R9: fix Ultramarines command retinue conditions'
          git pull --rebase origin main
          git push
