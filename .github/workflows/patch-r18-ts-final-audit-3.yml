name: Patch R18 TS final audit 3
on:
  push:
    paths:
      - '.github/build/patch_r18_ts_final_audit_3.py'
      - '.github/workflows/patch-r18-ts-final-audit-3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch final audit Land Raider validator
        run: python .github/build/patch_r18_ts_final_audit_3.py
      - name: Commit patched final audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/build/live_r18_thousand_sons_final_audit.py
          git diff --cached --quiet || git commit -m "Fix R18 final audit Land Raider validator"
          git push
