name: Apply Live R34 Rule Text and Sons of Horus
on:
  push:
    paths:
      - '.github/workflows/apply-live-r34-rules-soh-names.yml'
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R34
        run: python .github/build/live_r34_rules_soh_names.py
      - name: Verify parse and revisions
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='34'
          assert 'dataRevision="34"' in i
          assert 'ns0:' not in i
          print('Verified R34')
          PY
      - name: Commit Live R34
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r34-rules-soh-names.txt
          git diff --cached --quiet || git commit -m "Live R34: ProHammer rule text and Sons of Horus cleanup"
          git push
