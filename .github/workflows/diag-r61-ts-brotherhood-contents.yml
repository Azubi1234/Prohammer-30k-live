name: Diagnose R61 TS Brotherhood Contents
on:
  push:
    paths: ['.github/workflows/diag-r61-ts-brotherhood-contents.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r61_ts_brotherhood_contents.py
