name: Apply Live R21 Thousand Sons Rite Hotfix
on:
  push:
    paths:
      - '.github/workflows/apply-live-r21-ts-rite-hotfix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R21
        env: {R21_APPLY: '1'}
        run: python .github/build/live_r21_ts_rite_hotfix.py
      - name: Verify revisions
        run: |
          python - <<'PY'
          import re, xml.etree.ElementTree as ET
          cat=ET.parse('Legiones Astartes.cat').getroot()
          gst=ET.parse('Prohammer 30k.gst').getroot()
          idx=open('index.xml',encoding='utf-8').read()
          assert cat.get('revision')=='21', cat.get('revision')
          assert gst.get('revision')=='1', gst.get('revision')
          m=re.search(r'filePath="Legiones Astartes\.cat"[^>]*dataRevision="(\d+)"',idx)
          assert m and m.group(1)=='21', m.group(1) if m else None
          print('Verified CAT=21 GST=1 index=21')
          PY
      - name: Commit Live R21
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-live-r21-ts-rite-hotfix.txt
          git diff --cached --quiet || git commit -m "Live R21: fix Thousand Sons rites and Tactical loadout errors"
          git push
