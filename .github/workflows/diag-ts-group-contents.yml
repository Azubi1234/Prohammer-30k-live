name: Diagnose TS Group Contents
on:
  push:
    paths: ['.github/workflows/diag-ts-group-contents.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_ts_group_contents.py
