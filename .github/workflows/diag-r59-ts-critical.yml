name: Diagnose R59 TS Critical
on:
  push:
    paths: ['.github/workflows/diag-r59-ts-critical.yml']
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r59_ts_critical.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r59-ts-critical.txt
          git diff --cached --quiet || git commit -m "Diagnostic R59: Thousand Sons critical selectors"
          git push
