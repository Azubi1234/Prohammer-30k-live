name: Diagnose Live R5 Ultramarines
on:
  push:
    paths:
      - '.github/build/diag_live_r5_ultramarines.py'
      - '.github/workflows/diag-live-r5-ultramarines.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Inspect Ultramarines
        run: python .github/build/diag_live_r5_ultramarines.py
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-live-r5-ultramarines.txt
          git diff --cached --quiet || git commit -m 'Diagnostic: live R5 Ultramarines'
          git pull --rebase origin main
          git push
