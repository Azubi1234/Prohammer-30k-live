name: Audit modular empty groups
on:
  push:
    branches: [modular-catalogues]
    paths:
      - '.github/build/audit_modular_empty_groups.py'
      - '.github/workflows/audit-modular-empty-groups.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/build/audit_modular_empty_groups.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modular-empty-group-audit.json
          git diff --cached --quiet || git commit -m 'Audit modular empty groups'
          git pull --rebase origin modular-catalogues
          git push origin HEAD:modular-catalogues
