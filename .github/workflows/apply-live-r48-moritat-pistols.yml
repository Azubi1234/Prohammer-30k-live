name: Apply Live R48 Moritat Pistol Replacement
on:
  push:
    paths: ['.github/workflows/apply-live-r48-moritat-pistols.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R48
        run: python .github/build/live_r48_moritat_pistols.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='48'
          assert c.get('gameSystemRevision')=='11'
          assert 'dataRevision="48"' in i
          print('Verified R48')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r48-moritat-pistol-replacement.txt
          git diff --cached --quiet || git commit -m "Live R48: fix Moritat pistol replacement"
          git push
