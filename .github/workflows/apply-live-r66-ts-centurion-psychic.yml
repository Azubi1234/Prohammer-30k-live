name: Apply Live R66 TS Centurion Psychic UI
on:
  push:
    paths: ['.github/workflows/apply-live-r66-ts-centurion-psychic.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R66
        run: python .github/build/live_r66_ts_centurion_psychic.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='66'
          assert c.get('gameSystemRevision')=='15'
          assert 'dataRevision="66"' in i
          print('Verified R66')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r66-ts-centurion-psychic-ui.txt
          git diff --cached --quiet || git commit -m "Live R66: fix TS Centurion psychic selections"
          git push
