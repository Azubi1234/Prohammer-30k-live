name: Apply Live R16 Death Guard Plague scope fix
on:
  push:
    paths:
      - '.github/build/live_r16_death_guard_plague_scope_fix.py'
      - '.github/workflows/apply-live-r16-death-guard-plague-scope-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply R16 repair
        run: python .github/build/live_r16_death_guard_plague_scope_fix.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r=ET.parse('Legiones Astartes.cat').getroot()
          assert r.get('revision') == '16'
          ET.parse('index.xml')
          PY
      - name: Commit Live R16
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Legiones Astartes.cat' index.xml inspection-live-r16-death-guard-plague-scope-fix.txt
          git commit -m 'Live R16: scope Sons of the Plague Father correctly' || exit 0
          git push