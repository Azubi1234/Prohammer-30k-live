name: Apply Live R57 Centurion Psychic UI
# retry direct Centurion group lookup
on:
  push:
    paths: ['.github/workflows/apply-live-r57-centurion-psychic-ui.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R57
        run: python .github/build/live_r57_centurion_psychic_ui.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='57'
          assert c.get('gameSystemRevision')=='14'
          assert 'dataRevision="57"' in i
          print('Verified R57')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r57-centurion-psychic-ui.txt
          git diff --cached --quiet || git commit -m "Live R57: rebuild Thousand Sons Centurion psychic UI"
          git push
