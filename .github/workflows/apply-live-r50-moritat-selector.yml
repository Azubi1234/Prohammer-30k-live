name: Apply Live R50 Moritat Pistol Selector
on:
  push:
    paths: ['.github/workflows/apply-live-r50-moritat-selector.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R50
        run: python .github/build/live_r50_moritat_selector.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='50'
          assert c.get('gameSystemRevision')=='11'
          assert 'dataRevision="50"' in i
          print('Verified R50')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r50-moritat-pistol-selector.txt
          git diff --cached --quiet || git commit -m "Live R50: make Moritat pistol pair a true one-of selector"
          git push
