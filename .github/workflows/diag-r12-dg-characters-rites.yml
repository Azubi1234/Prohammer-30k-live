name: Diagnose R12 Death Guard characters and rites
on:
  push:
    paths:
      - '.github/build/diag_r12_dg_characters_rites.py'
      - '.github/workflows/diag-r12-dg-characters-rites.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r12_dg_characters_rites.py
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-r12-dg-characters-rites.txt
          git diff --cached --quiet || git commit -m 'Diagnostic: R12 Death Guard characters and rites'
          git pull --rebase origin main
          git push
