name: Diagnose R19 Iron Hands bionics
on:
  push:
    paths:
      - '.github/build/diag_r19_iron_hands_bionics.py'
      - '.github/workflows/diag-r19-iron-hands-bionics.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r19_iron_hands_bionics.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r19-iron-hands-bionics.txt
          git diff --cached --quiet || git commit -m "Inspect R19 Iron Hands bionics"
          git push
