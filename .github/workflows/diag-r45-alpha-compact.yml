name: Diagnose R45 Alpha Compact
on:
  push:
    paths: ['.github/workflows/diag-r45-alpha-compact.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r45_alpha_compact.py
