name: Apply Live R61 TS Brotherhood Psychic
on:
  push:
    paths: ['.github/workflows/apply-live-r61-ts-brotherhood.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R61
        run: python .github/build/live_r61_ts_brotherhood_psychic.py
      - name: Verify
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot()
          i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='61'
          assert c.get('gameSystemRevision')=='14'
          assert 'dataRevision="61"' in i
          print('Verified R61')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r61-ts-brotherhood-psychic.txt
          git diff --cached --quiet || git commit -m "Live R61: fix Thousand Sons Psychic Brotherhood access"
          git push
