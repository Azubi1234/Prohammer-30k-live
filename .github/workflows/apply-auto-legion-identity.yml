name: Apply automatic Legion identity
on:
  push:
    paths:
      - '.github/build/auto_legion_identity.py'
      - '.github/workflows/apply-auto-legion-identity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/auto_legion_identity.py
      - run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in [Path("Legiones-Astartes-Generic.cat"), *Path(".").glob("*.cat"), Path("index.xml")]:
              ET.parse(p)
          print("XML parse OK")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Legiones-Astartes-Generic.cat Dark-Angels.cat Emperor-s-Children.cat Iron-Warriors.cat White-Scars.cat Space-Wolves.cat Imperial-Fists.cat Night-Lords.cat Blood-Angels.cat Iron-Hands.cat World-Eaters.cat Ultramarines.cat Death-Guard.cat Thousand-Sons.cat Sons-of-Horus.cat Word-Bearers.cat Salamanders.cat Raven-Guard.cat Alpha-Legion.cat index.xml
          git diff --cached --quiet || git commit -m "Auto-select Legion identity in Legion catalogues"
          git push
