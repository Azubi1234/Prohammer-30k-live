name: Apply automatic Legion identity
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/auto_legion_identity.py
      - run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse(Path("Legiones-Astartes-Generic.cat"))
          ET.parse(Path("index.xml"))
          legion_files = ["Dark-Angels.cat","Emperor-s-Children.cat","Iron-Warriors.cat","White-Scars.cat","Space-Wolves.cat","Imperial-Fists.cat","Night-Lords.cat","Blood-Angels.cat","Iron-Hands.cat","World-Eaters.cat","Ultramarines.cat","Death-Guard.cat","Thousand-Sons.cat","Sons-of-Horus.cat","Word-Bearers.cat","Salamanders.cat","Raven-Guard.cat","Alpha-Legion.cat"]
          for p in legion_files:
              text=Path(p).read_text(encoding="utf-8")
              assert "Automatic Legion Identity" in text, p
          print("Generic/index XML parse OK; all 18 Legion identity markers present")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Legiones-Astartes-Generic.cat *.cat index.xml
          git diff --cached --quiet || git commit -m "Refresh automatic Legion identity"
          git push
