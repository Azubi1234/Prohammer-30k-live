name: Diagnose R58 Brotherhood Exact
on:
  push:
    paths: ['.github/workflows/diag-r58-brotherhood-exact.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r58_brotherhood_exact.py
