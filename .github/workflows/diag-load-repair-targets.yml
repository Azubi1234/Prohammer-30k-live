name: Diagnose Load Repair Targets
on:
  push:
    paths: ['.github/workflows/diag-load-repair-targets.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_load_repair_targets.py
