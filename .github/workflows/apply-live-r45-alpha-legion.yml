name: Apply Live R45 Alpha Legion
on:
  push:
    paths: ['.github/workflows/apply-live-r45-alpha-legion.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/live_r45_alpha_legion.py
      - run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          c=ET.parse('Legiones Astartes.cat').getroot();g=ET.parse('Prohammer 30k.gst').getroot();i=open('index.xml',encoding='utf-8').read()
          assert c.get('revision')=='45' and c.get('gameSystemRevision')=='10'
          assert g.get('revision')=='10'
          assert 'dataRevision="45"' in i and 'dataRevision="10"' in i
          print('Verified R45')
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml inspection-live-r45-alpha-legion.txt
          git diff --cached --quiet || git commit -m "Live R45: Alpha Legion native implementation"
          git push
