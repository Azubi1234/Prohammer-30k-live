name: Diagnose R49 Dark Angels Regression
on:
  push:
    paths: ['.github/workflows/diag-r49-dark-angels-regression.yml']
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r49_dark_angels_regression.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r49-dark-angels-regression.txt
          git diff --cached --quiet || git commit -m "Diagnostic R49: Dark Angels regression"
          git push
