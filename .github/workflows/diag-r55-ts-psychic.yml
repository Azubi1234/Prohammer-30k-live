name: Diagnose R55 Thousand Sons Psychic
on:
  push:
    paths: ['.github/workflows/diag-r55-ts-psychic.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r55_ts_psychic.py
