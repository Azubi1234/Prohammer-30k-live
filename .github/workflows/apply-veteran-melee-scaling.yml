name: Apply Veteran Melee Scaling Fix
on:
  push:
    paths: ['.github/workflows/apply-veteran-melee-scaling.yml']
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/fix_veteran_melee_scaling.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-veteran-melee-scaling.txt
          git diff --cached --quiet || git commit -m "Fix Veteran melee weapon scaling"
          git push
