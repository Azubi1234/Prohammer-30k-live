name: Apply Live R32 Sons of Horus
on:
  push:
    paths:
      - '.github/workflows/apply-live-r32-sons-of-horus.yml'
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R32
        env: {R32_APPLY: '1'}
        run: python .github/build/live_r32_sons_of_horus.py
      - name: Verify revisions and parse
        run: |
          python - <<'PY'
          import re, xml.etree.ElementTree as ET
          cat=ET.parse('Legiones Astartes.cat').getroot()
          idx=open('index.xml',encoding='utf-8').read()
          assert cat.get('revision')=='32', cat.get('revision')
          assert 'filePath="Legiones Astartes.cat"' in idx
          assert 'dataRevision="32"' in idx
          print('Verified CAT=32 index=32')
          PY
      - name: Commit Live R32
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r32-sons-of-horus.txt
          git diff --cached --quiet || git commit -m "Live R32: Sons of Horus implementation"
          git push

