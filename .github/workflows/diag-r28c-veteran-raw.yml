name: Diagnose R28C Veteran Raw
on:
  push:
    paths:
      - '.github/workflows/diag-r28c-veteran-raw.yml'
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r28c_veteran_raw.py
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r28c-veteran-raw.txt
          git diff --cached --quiet || git commit -m "Diag R28C: veteran raw XML"
          git push
