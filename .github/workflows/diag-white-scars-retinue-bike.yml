name: Diagnose White Scars retinue bike options
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-white-scars-retinue-bike.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bike entries
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          NS='http://www.battlescribe.net/schema/catalogueSchema'; C=lambda t:f'{{{NS}}}{t}'
          root=ET.parse('Legiones Astartes.cat').getroot(); out=[]
          for charid in ('r41-unit-v-6-shiban-khan','r41-unit-v-7-hibou-khan'):
            char=next(x for x in root.iter(C('selectionEntry')) if x.get('id')==charid)
            out.append('=== '+charid+' '+char.get('name','')+' ===')
            for e in char.iter():
              nm=(e.get('name') or '')
              if 'bike' in nm.lower() or 'jetbike' in nm.lower():
                out.append(ET.tostring(e,encoding='unicode'))
          Path('inspection-ws-retinue-bike.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-ws-retinue-bike.txt
          git diff --cached --quiet || git commit -m 'Diagnostic: White Scars retinue bike options'
          git pull --rebase origin main
          git push
