name: Diagnose R17 TS transport sources
on:
  push:
    paths:
      - '.github/build/diag_r17_ts_transport_sources.py'
      - '.github/workflows/diag-r17-ts-transport-sources.yml'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Inspect transport sources
        run: python .github/build/diag_r17_ts_transport_sources.py
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r17-ts-transport-sources.txt
          git diff --cached --quiet || git commit -m "Inspect R17 TS transport sources"
          git push
