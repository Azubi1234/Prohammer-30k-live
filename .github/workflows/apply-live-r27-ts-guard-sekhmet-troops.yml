name: Apply Live R27 Guard Sekhmet Troops
on:
  push:
    paths:
      - '.github/workflows/apply-live-r27-ts-guard-sekhmet-troops.yml'
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Apply R27
        env: {R27_APPLY: '1'}
        run: python .github/build/live_r27_ts_guard_sekhmet_troops.py
      - name: Verify revisions and parse
        run: |
          python - <<'PY'
          import re, xml.etree.ElementTree as ET
          cat=ET.parse('Legiones Astartes.cat').getroot()
          idx=open('index.xml',encoding='utf-8').read()
          assert cat.get('revision')=='27', cat.get('revision')
          m=re.search(r'filePath="Legiones Astartes\.cat"[^>]*dataRevision="(\d+)"',idx)
          assert m and m.group(1)=='27', m.group(1) if m else None
          print('Verified CAT=27 index=27')
          PY
      - name: Commit Live R27
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'Legiones Astartes.cat' index.xml inspection-live-r27-ts-guard-sekhmet-troops.txt
          git diff --cached --quiet || git commit -m "Live R27: make Guard Sekhmet real Troops"
          git push
