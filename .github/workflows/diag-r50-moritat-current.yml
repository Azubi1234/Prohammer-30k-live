name: Diagnose R50 Moritat Current
on:
  push:
    paths: ['.github/workflows/diag-r50-moritat-current.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r50_moritat_current.py
