name: Diagnose R4 Tactical and Chainaxe
on:
  push:
    paths:
      - '.github/build/diag_r4_tactical_chainaxe.py'
      - '.github/workflows/diag-r4-tactical-chainaxe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Inspect catalogue
        run: python .github/build/diag_r4_tactical_chainaxe.py
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-r4-tactical-chainaxe.txt
          git diff --cached --quiet || git commit -m 'Diagnostic: R4 tactical and chainaxe structure'
          git pull --rebase origin main
          git push
