name: Dry-run R27 Guard Sekhmet Troops
on:
  push:
    paths:
      - '.github/build/live_r27_ts_guard_sekhmet_troops.py'
      - '.github/workflows/dry-run-r27-ts-guard-sekhmet-troops.yml'
permissions: {contents: write}
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Dry run
        env: {R27_APPLY: '0'}
        run: python .github/build/live_r27_ts_guard_sekhmet_troops.py
      - name: Verify live files untouched
        run: git diff --exit-code -- 'Legiones Astartes.cat' index.xml
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-live-r27-ts-guard-sekhmet-troops.txt
          git diff --cached --quiet || git commit -m "Inspect R27 Guard Sekhmet Troops fix"
          git push
