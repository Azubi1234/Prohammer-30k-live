name: Diagnose R20 TS Rite and Tactical Errors
on:
  push:
    paths:
      - '.github/build/diag_r20_ts_rite_tactical_errors.py'
      - '.github/workflows/diag-r20-ts-rite-tactical-errors.yml'
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r20_ts_rite_tactical_errors.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r20-ts-rite-tactical-errors.txt
          git diff --cached --quiet || git commit -m "Inspect R20 Thousand Sons rite and tactical errors"
          git push
