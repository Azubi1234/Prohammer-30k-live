name: Clean modular legacy references v2

on:
  push:
    branches: [modular-catalogues]
    paths:
      - '.github/build/clean_modular_legacy_refs.py'
      - '.github/workflows/clean-modular-legacy-refs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/build/clean_modular_legacy_refs.py
      - run: python .github/build/validate_modular_family.py
      - run: python .github/build/validate_modular_references.py
      - name: Commit cleaned staging catalogues
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modular-catalogues-generated modular-reference-audit.json
          git diff --cached --quiet || git commit -m 'Clean modular legacy cross-references'
          git pull --rebase origin modular-catalogues
          git push origin HEAD:modular-catalogues
