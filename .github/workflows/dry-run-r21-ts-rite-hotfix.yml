name: Dry-run R21 Thousand Sons Rite Hotfix
on:
  push:
    paths:
      - '.github/build/live_r21_ts_rite_hotfix.py'
      - '.github/workflows/dry-run-r21-ts-rite-hotfix.yml'
permissions: {contents: write}
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Dry run
        env: {R21_APPLY: '0'}
        run: python .github/build/live_r21_ts_rite_hotfix.py
      - name: Verify live files unchanged
        run: git diff --exit-code -- 'Legiones Astartes.cat' 'Prohammer 30k.gst' index.xml
      - name: Commit inspection
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-live-r21-ts-rite-hotfix.txt
          git diff --cached --quiet || git commit -m "Inspect R21 Thousand Sons rite hotfix"
          git push
