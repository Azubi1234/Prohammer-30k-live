name: Diagnose point thresholds
on:
  push:
    paths:
      - '.github/build/diag_point_thresholds.py'
      - '.github/workflows/diag-point-thresholds.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_point_thresholds.py
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspection-point-thresholds.txt
          git diff --cached --quiet || git commit -m 'Diagnostic: point thresholds'
          git pull --rebase origin main
          git push
