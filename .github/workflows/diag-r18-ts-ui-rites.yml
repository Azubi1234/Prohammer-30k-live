name: Diagnose R18 TS UI and Rites
on:
  push:
    paths:
      - '.github/build/diag_r18_ts_ui_rites.py'
      - '.github/workflows/diag-r18-ts-ui-rites.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/build/diag_r18_ts_ui_rites.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inspection-r18-ts-ui-rites-diag.txt
          git diff --cached --quiet || git commit -m "Inspect R18 TS UI and rites"
          git push
