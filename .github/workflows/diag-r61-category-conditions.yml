name: Diagnose R61 Category Conditions
on:
  push:
    paths: ['.github/workflows/diag-r61-category-conditions.yml']
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python .github/build/diag_r61_category_conditions.py
